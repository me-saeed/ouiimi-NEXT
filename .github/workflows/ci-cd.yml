name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20.x"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-for-ci
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          MAILJET_API_KEY: test-key
          MAILJET_SECRET_KEY: test-secret
          STRIPE_SECRET_KEY: test-stripe-secret
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: test-stripe-publishable
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: test-google-maps-key
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          CRON_SECRET: 3f4a9b8c7d6e5f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/dummy-build
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Build application for deployment
        run: |
          echo "Building application..."
          npm ci --legacy-peer-deps
          npm run build
          echo "✅ Build completed"
        env:
          MONGODB_URI: mongodb://localhost:27017/dummy-build
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Prepare deployment package
        run: |
          set +e
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='deploy.tar.gz' \
            --exclude='.env.local' \
            --exclude='.env*.local' \
            --exclude='__tests__' \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            --exclude='jest.config.js' \
            --exclude='jest.setup.js' \
            --exclude='uploads' \
            --exclude='jest-reporter.js' \
            . 2>&1 | grep -v "file changed as we read it" || true
          set -e

          if [ ! -f deploy.tar.gz ]; then
            echo "❌ Failed to create deployment package"
            exit 1
          fi

          echo "✅ Deployment package created ($(du -h deploy.tar.gz | cut -f1))"

      - name: Deploy to server
        run: |
          scp -o ServerAliveInterval=60 -o ServerAliveCountMax=3 deploy.tar.gz ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/tmp/deploy.tar.gz

          cat > /tmp/deploy_env.sh << ENVEOF
          export APP_PATH="${{ secrets.DO_APP_PATH }}"
          export MONGODB_URI_VAL="${{ secrets.MONGODB_URI }}"
          export JWT_SECRET_VAL="${{ secrets.JWT_SECRET }}"
          export NEXTAUTH_SECRET_VAL="${{ secrets.NEXTAUTH_SECRET }}"
          export NEXTAUTH_URL_VAL="${{ secrets.NEXTAUTH_URL }}"
          export MAILJET_API_KEY_VAL="${{ secrets.MAILJET_API_KEY }}"
          export MAILJET_SECRET_KEY_VAL="${{ secrets.MAILJET_SECRET_KEY }}"
          export MAILJET_FROM_EMAIL_VAL="${{ secrets.MAILJET_FROM_EMAIL }}"
          export MAILJET_FROM_NAME_VAL="${{ secrets.MAILJET_FROM_NAME }}"
          export STRIPE_SECRET_KEY_VAL="${{ secrets.STRIPE_SECRET_KEY }}"
          export NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_VAL="${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
          export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_VAL="${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}"
          export GOOGLE_CLIENT_ID_VAL="${{ secrets.GOOGLE_CLIENT_ID }}"
          export GOOGLE_CLIENT_SECRET_VAL="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          export NEXT_PUBLIC_BASE_URL_VAL="${{ secrets.NEXT_PUBLIC_BASE_URL }}"
          export CRON_SECRET_VAL="${{ secrets.CRON_SECRET }}"
          ENVEOF

          scp -o ServerAliveInterval=60 -o ServerAliveCountMax=3 /tmp/deploy_env.sh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/tmp/deploy_env.sh

          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "source /tmp/deploy_env.sh && bash" << 'DEPLOYSCRIPT'
            set -e

            echo "APP_PATH is set to: [$APP_PATH]"

            if [ -z "$APP_PATH" ]; then
              echo "❌ Error: APP_PATH is empty. Please check DO_APP_PATH secret."
              exit 1
            fi

            # ---------------------------
            # ✅ Persistent uploads fix
            # ---------------------------
            SHARED_DIR="/var/lib/ouiimi"
            SHARED_UPLOADS="${SHARED_DIR}/uploads"

            sudo mkdir -p "$SHARED_UPLOADS"
            sudo chmod -R 755 "$SHARED_DIR" || true

            if [ ! -d "$APP_PATH" ]; then
              echo "Creating application directory: $APP_PATH"
              mkdir -p "$APP_PATH"
            fi

            if [ -d "$APP_PATH" ] && [ "$(ls -A $APP_PATH 2>/dev/null)" ]; then
              echo "Backing up existing directory..."
              cd /root
              mv "$APP_PATH" "${APP_PATH}.backup.$(date +%s)" 2>/dev/null || true
              mkdir -p "$APP_PATH"
            fi

            echo "Extracting deployment package..."
            cd "$APP_PATH"
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            # Force uploads to point to shared persistent folder (never deleted by deploy)
            rm -rf "$APP_PATH/uploads" 2>/dev/null || true
            ln -s "$SHARED_UPLOADS" "$APP_PATH/uploads"
            echo "✅ uploads -> $SHARED_UPLOADS"

            echo "Checking Node.js version..."
            NODE_VERSION=$(node -v | cut -d'v' -f2 | cut -d'.' -f1,2)
            REQUIRED_VERSION="18.17"

            if [ "$(printf '%s\n' "$REQUIRED_VERSION" "$NODE_VERSION" | sort -V | head -n1)" != "$REQUIRED_VERSION" ]; then
              echo "⚠️  Node.js version $NODE_VERSION is too old. Required: >= $REQUIRED_VERSION"
              echo "Installing Node.js 20.x using nvm..."

              if [ ! -d "$HOME/.nvm" ]; then
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash || true
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              else
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              fi

              nvm install 20 || true
              nvm use 20 || true
              nvm alias default 20 || true

              NEW_NODE_VERSION=$(node -v)
              echo "✅ this is just Node.js updated to: $NEW_NODE_VERSION"
            else
              echo "✅ Node.js version $NODE_VERSION is compatible"
            fi

            # Yarn installation removed as project uses npm

            git config --global --add safe.directory "$APP_PATH" || true

            if [ ! -d ".git" ]; then
              echo "Initializing git repository (optional)..."
              git init || true
              git remote add origin https://github.com/me-saeed/ouiimi-NEXT.git || true
              git config user.email "deploy@ouiimi.com" || true
              git config user.name "Deployment Bot" || true
              git add . || true
              git commit -m "Initial deployment" || true
            fi

            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 20 || nvm use default || true
            fi

            echo "Updating .env.production from GitHub Secrets..."

            MONGODB_URI_FINAL="${MONGODB_URI_VAL:-mongodb://localhost:27017/ouiimi}"
            JWT_SECRET_FINAL="${JWT_SECRET_VAL:-change-this}"
            NEXTAUTH_SECRET_FINAL="${NEXTAUTH_SECRET_VAL:-change-this}"
            NEXTAUTH_URL_FINAL="${NEXTAUTH_URL_VAL:-https://ouiimi.com.au}"
            MAILJET_API_KEY_FINAL="${MAILJET_API_KEY_VAL:-change-this}"
            MAILJET_SECRET_KEY_FINAL="${MAILJET_SECRET_KEY_VAL:-change-this}"
            MAILJET_FROM_EMAIL_FINAL="${MAILJET_FROM_EMAIL_VAL:-information@ouiimi.com}"
            MAILJET_FROM_NAME_FINAL="${MAILJET_FROM_NAME_VAL:-Ouiimi}"

            STRIPE_SECRET_KEY_FINAL="${STRIPE_SECRET_KEY_VAL:-change-this}"
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_FINAL="${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_VAL:-change-this}"
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_FINAL="${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_VAL:-change-this}"
            GOOGLE_CLIENT_ID_FINAL="${GOOGLE_CLIENT_ID_VAL:-change-this}"
            GOOGLE_CLIENT_SECRET_FINAL="${GOOGLE_CLIENT_SECRET_VAL:-change-this}"

            if [ ! -f "$APP_PATH/.env.production" ]; then
              echo "Creating .env.production..."
              printf '%s\n' \
                "NODE_ENV=production" \
                "MONGODB_URI=${MONGODB_URI_FINAL}" \
                "JWT_SECRET=${JWT_SECRET_FINAL}" \
                "NEXTAUTH_SECRET=${NEXTAUTH_SECRET_FINAL}" \
                "NEXTAUTH_URL=${NEXTAUTH_URL_FINAL}" \
                "MAILJET_API_KEY=${MAILJET_API_KEY_FINAL}" \
                "MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY_FINAL}" \
                "MAILJET_FROM_EMAIL=${MAILJET_FROM_EMAIL_FINAL}" \
                "MAILJET_FROM_NAME=${MAILJET_FROM_NAME_FINAL}" \
                "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY_FINAL}" \
                "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_FINAL}" \
                "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_FINAL}" \
                "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_FINAL}" \
                "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET_FINAL}" > "$APP_PATH/.env.production"
              echo "✅ Created .env.production"
            else
              echo "Updating existing .env.production..."

              upsert_env () {
                KEY="$1"
                VAL="$2"
                FILE="$3"
                if [ -z "$VAL" ]; then
                  return 0
                fi
                VAL_ESCAPED=$(printf '%s' "$VAL" | sed 's/[\/&]/\\&/g')
                if grep -q "^${KEY}=" "$FILE" 2>/dev/null; then
                  sed -i "s|^${KEY}=.*|${KEY}=${VAL_ESCAPED}|" "$FILE"
                else
                  printf '%s\n' "${KEY}=${VAL}" >> "$FILE"
                fi
              }

              upsert_env "MONGODB_URI" "$MONGODB_URI_VAL" "$APP_PATH/.env.production"
              upsert_env "JWT_SECRET" "$JWT_SECRET_VAL" "$APP_PATH/.env.production"
              upsert_env "NEXTAUTH_SECRET" "$NEXTAUTH_SECRET_VAL" "$APP_PATH/.env.production"
              upsert_env "NEXTAUTH_URL" "$NEXTAUTH_URL_VAL" "$APP_PATH/.env.production"
              upsert_env "MAILJET_API_KEY" "$MAILJET_API_KEY_VAL" "$APP_PATH/.env.production"
              upsert_env "MAILJET_SECRET_KEY" "$MAILJET_SECRET_KEY_VAL" "$APP_PATH/.env.production"
              upsert_env "MAILJET_FROM_EMAIL" "$MAILJET_FROM_EMAIL_VAL" "$APP_PATH/.env.production"
              upsert_env "MAILJET_FROM_NAME" "$MAILJET_FROM_NAME_VAL" "$APP_PATH/.env.production"

              upsert_env "STRIPE_SECRET_KEY" "$STRIPE_SECRET_KEY_VAL" "$APP_PATH/.env.production"
              upsert_env "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_VAL" "$APP_PATH/.env.production"
              upsert_env "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_VAL" "$APP_PATH/.env.production"
              upsert_env "GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_ID_VAL" "$APP_PATH/.env.production"
              upsert_env "GOOGLE_CLIENT_SECRET" "$GOOGLE_CLIENT_SECRET_VAL" "$APP_PATH/.env.production"

              echo "✅ Updated .env.production"
            fi

            echo "Installing production dependencies..."
            echo "Using Node.js: $(node -v)"
            echo "Using npm: $(npm -v)"
            npm install --legacy-peer-deps

            if [ ! -d "$APP_PATH/.next" ]; then
              echo "⚠️  Warning: .next directory not found. Building on server..."
              set -a
              [ -f "$APP_PATH/.env.production" ] && source "$APP_PATH/.env.production"
              set +a
              npm run build
            else
              echo "✅ Build files found (.next directory exists)"
            fi

            mkdir -p "$APP_PATH/logs"

            echo "Restarting application..."

            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 20 || nvm use default || true
            fi

            cd "$APP_PATH"

            echo "Checking PM2 status..."
            PM2_STATUS=$(pm2 list | grep -E "ouiimi|ecosystem" || echo "")

            if [ -n "$PM2_STATUS" ]; then
              echo "App found in PM2, stopping and removing..."
              pm2 stop ouiimi || true
              pm2 delete ouiimi || true
              pm2 stop ecosystem.config.js || true
              pm2 delete ecosystem.config.js || true
            fi

            echo "Verifying .env.production..."
            if [ -f "$APP_PATH/.env.production" ]; then
              echo "✅ .env.production exists"
            else
              echo "❌ .env.production not found!"
            fi

            echo "Starting application with PM2..."
            pm2 start ecosystem.config.js --update-env

            pm2 save || true

            echo "PM2 status:"
            pm2 list

            echo "Checking environment variables..."
            pm2 env 0 | grep -E "MONGODB_URI|NODE_ENV|NEXTAUTH_URL|STRIPE|GOOGLE" || echo "Note: Use 'pm2 env <id>' to see full env"

            echo "Reloading Nginx..."
            nginx -t && systemctl reload nginx

            echo "✅ Deployment completed successfully!"

            rm -f /tmp/deploy_env.sh
          DEPLOYSCRIPT

          rm -f /tmp/deploy_env.sh

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 15
          echo "Testing health endpoint..."
          for i in {1..5}; do
            echo "Attempt $i/5..."
            if curl -f -m 10 https://ouiimi.com.au/api/health 2>/dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Health check failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "⚠️  Health check failed after 5 attempts"
          exit 0
